<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb Local</title>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #0b0d18; overflow: hidden; font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0b0d18; }
  #bar { position: fixed; right: 10px; bottom: 10px; z-index: 10; display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 999px;
    background: rgba(18, 20, 38, .72); color: #e9e8ff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.08);
    opacity: .55; transition: opacity .2s; user-select: none; }
  #bar:hover, #bar:focus-within { opacity: 1; }
  #bar .dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, #9d8cff, #5ed1ff); box-shadow: 0 0 8px #8f9dff; }
  #bar b { font-weight: 600; }
  #bar a, #bar button { all: unset; cursor: pointer; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.08); color: #fff; }
  #bar a:hover, #bar button:hover { background: rgba(255,255,255,.18); }
  #bar .err { background: #ff5c7a33; color: #ffb3c1; }
  #toasts { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 11; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .toast { padding: 8px 14px; border-radius: 14px; background: rgba(18, 20, 38, .85); color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.3); max-width: min(90vw, 460px); animation: pop .18s ease-out; }
  .toast.error { background: rgba(120, 20, 45, .9); }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
  #sheet { position: fixed; inset: 0; z-index: 12; display: none; align-items: center; justify-content: center; background: rgba(5, 6, 15, .45); }
  #sheet.open { display: flex; }
  #sheet .card { width: min(88vw, 340px); padding: 20px; border-radius: 22px; background: #f7f5ff; color: #1c1a33; box-shadow: 0 18px 60px rgba(0,0,0,.4); text-align: center; }
  #sheet .emoji { font-size: 40px; }
  #sheet h2 { margin: 6px 0 2px; font-size: 19px; }
  #sheet p { margin: 6px 0; color: #5b5876; }
  #sheet .row { display: flex; gap: 8px; margin-top: 14px; }
  #sheet button { flex: 1; padding: 10px; border: 0; border-radius: 14px; font: inherit; font-weight: 600; cursor: pointer; background: #e6e2fa; color: #1c1a33; }
  #sheet button.buy { background: linear-gradient(135deg, #8b7cff, #4fb8ff); color: #fff; }
</style>
</head>
<body>
<iframe id="world" title="World" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; magnetometer; xr-spatial-tracking; clipboard-write; midi; screen-wake-lock"
  sandbox="allow-scripts allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads"></iframe>
<div id="bar" role="toolbar" aria-label="Orb Local">
  <span class="dot" aria-hidden="true"></span>
  <span><b>Orb Local</b> · <span id="who"></span> · <span id="here">1 here</span></span>
  <button id="errors" class="err" hidden></button>
  <button id="add" title="Open another player in a new tab">+ Player</button>
  <a id="orb" target="_blank" rel="noopener" hidden>Play on Orb ↗</a>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
  <div class="card">
    <div class="emoji" id="sheet-emoji"></div>
    <h2 id="sheet-name"></h2>
    <p id="sheet-desc"></p>
    <p><b id="sheet-price"></b></p>
    <p style="font-size:12px">Orb Local: nothing is charged. On Orb, players buy this with their credits.</p>
    <div class="row"><button id="sheet-cancel">Cancel</button><button id="sheet-buy" class="buy">Get it</button></div>
  </div>
</div>
<script type="module" src="/__orb/host.js"></script>
</body>
</html>
